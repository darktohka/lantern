<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a4640"/>
      <stop offset="50%" stop-color="#245b53"/>
      <stop offset="100%" stop-color="#1a4640"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d89b1d"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
  </defs>
  <!-- handle/wire -->
  <rect x="14" y="2" width="4" height="3" rx="1" fill="#d89b1d"/>
  <!-- top cap -->
  <rect x="10" y="5" width="12" height="3" rx="1" fill="#d89b1d"/>
  <!-- lantern body -->
  <rect x="8" y="8" width="16" height="16" rx="4" fill="url(#body)"/>
  <!-- inner glow -->
  <rect x="11" y="10" width="10" height="12" rx="2" fill="url(#glow)" opacity="0.85"/>
  <!-- top rib -->
  <rect x="8" y="10" width="16" height="1" rx="0.5" fill="#d89b1d" opacity="0.6"/>
  <!-- middle rib -->
  <rect x="8" y="15" width="16" height="1" rx="0.5" fill="#d89b1d" opacity="0.6"/>
  <!-- bottom rib -->
  <rect x="8" y="20" width="16" height="1" rx="0.5" fill="#d89b1d" opacity="0.6"/>
  <!-- bottom cap -->
  <rect x="10" y="24" width="12" height="3" rx="1" fill="#d89b1d"/>
  <!-- tassel -->
  <rect x="15" y="27" width="2" height="4" rx="1" fill="#d89b1d"/>
  <circle cx="16" cy="31" r="1.5" fill="#d89b1d"/>
  <!-- highlight -->
  <rect x="12" y="11" width="3" height="8" rx="1.5" fill="#fff" opacity="0.15"/>
</svg>
