[package]
name = "lantern"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
irontide = { version = "1.7.0", default-features = false, features = ["crypto-ring"] }
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "rustls", "hickory-dns", "query", "form"], default-features = false }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
pow-captcha-axum = "0.2"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate"], default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release-lto]
inherits = "release"
lto = true
strip = true
panic = "abort"
