name: Build and push multi-arch container

on:
  push:
  workflow_dispatch:
  repository_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'darktohka/lantern' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            tag_suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag_suffix: arm64
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:linux-${{ matrix.tag_suffix }}
          build-args: |
            PROFILE=release-lto

  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifest
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          docker buildx imagetools create \
            -t $IMG:latest \
            -t $IMG:${{ github.sha }} \
            $IMG:linux-amd64 \
            $IMG:linux-arm64
